name: Build & Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/regover13/tsbot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Auf den VPS ausrollen
        if: success()
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # Der Schluessel ist serverseitig auf /opt/tsbot/deploy.sh festgenagelt
          # (command= in authorized_keys), der Aufrufer kann also kein anderes
          # Kommando waehlen; der Commit-SHA landet in SSH_ORIGINAL_COMMAND.
          #
          # Das Pull-Token erzeugt GitHub bei jedem Lauf neu und wird ueber stdin
          # uebergeben. Auf dem Server bleibt damit kein dauerhaftes Geheimnis
          # zurueck -- der frueher hier hinterlegte Portainer-PAT lief ab und legte
          # den Deploy ab dem 2026-08-19 unbemerkt lahm.
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SSH_KEY" > deploy_key
          printf '%s\n' "$PULL_TOKEN" | ssh -i deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            root@167.86.127.129 "$GIT_SHA"
          rm -f deploy_key
