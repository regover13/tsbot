# TSBot: PulseAudio darf sich im Leerlauf nicht beenden.
#
# WARUM: Die Null-Sinks tsbot_sink und tsbot_null_mic legt
# tsbot-pulseaudio.service an -- eine Oneshot-Unit mit RemainAfterExit=yes,
# die genau einmal beim Systemstart laeuft. Die Sinks leben aber IM
# PulseAudio-Daemon. Beendet der sich (Standard: 20 s nach dem letzten
# Client) und wird spaeter per Socket-Aktivierung frisch gestartet, kommt er
# nur mit auto_null hoch -- und niemand legt die Sinks neu an. Der TSBot
# meldet dann "PulseAudio-Sink tsbot_sink nicht gefunden".
#
# Genau so geschehen am 2026-07-27: der Boot am 23.07. um 13:40 legte die
# Sinks an, am 27.07. um 09:43:57 startete der On-Demand-TS3-Client einen
# neuen Daemon -- Sinks weg, Aufnahme unmoeglich.
#
# --exit-idle-time=-1 nimmt dem Daemon das Beenden im Leerlauf. Das
# Startskript (scripts/start_pulseaudio.sh im TSBot-Projekt) setzt das Flag
# laengst; die systemd-User-Unit tat es nicht. Diese Ergaenzung schliesst
# genau diese Luecke -- an der Wurzel, nicht am Symptom.
#
# ⚠ Die leere erste ExecStart-Zeile ist Pflicht. Ohne sie HAENGT systemd den
# zweiten Befehl an die Liste an, statt ihn zu ersetzen, und die Unit
# scheitert mit zwei konkurrierenden Daemons.
[Service]
ExecStart=
ExecStart=/usr/bin/pulseaudio --daemonize=no --log-target=journal --exit-idle-time=-1
